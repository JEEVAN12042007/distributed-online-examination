spring.application.name=api-gateway1

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Exam Service
spring.cloud.gateway.routes[1].id=exam-service
spring.cloud.gateway.routes[1].uri=lb://EXAM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/exams/**

# Submission Service
spring.cloud.gateway.routes[2].id=submission-service
spring.cloud.gateway.routes[2].uri=lb://SUBMISSION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/submissions/**

# Evaluation Service
spring.cloud.gateway.routes[3].id=evaluation-service
spring.cloud.gateway.routes[3].uri=lb://EVALUATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/evaluations/**